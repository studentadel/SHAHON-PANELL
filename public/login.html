<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود | ISSPanel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <style>
    body { font-family: Vazirmatn, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-blue-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-blue-500/30 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold">ورود به پنل</h1>
      <p class="text-slate-400 text-sm mt-1">ISSPanel Management</p>
    </div>

    <form action="/login" method="POST" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-5">
      <div>
        <label class="block text-sm text-slate-300 mb-1.5">نام کاربری</label>
        <input type="text" name="username" required
          class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 transition"
          placeholder="admin" />
      </div>
      <div>
        <label class="block text-sm text-slate-300 mb-1.5">رمز عبور</label>
        <input type="password" name="password" required
          class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 transition"
          placeholder="••••••••" />
      </div>
      <button type="submit"
        class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 font-medium transition shadow-lg shadow-blue-600/20">
        ورود
      </button>
    </form>
  </div>
</body>
</html>
